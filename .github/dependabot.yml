version: 2
updates:
  - package-ecosystem: "bun"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 25
    labels:
      - "dependencies"
      - "javascript"
    commit-message:
      prefix: "deps"
      include: "scope"
    groups:
      lint-tooling:
        patterns:
          - "eslint*"
          - "@eslint/*"
          - "@stylistic/eslint-plugin"
          - "typescript-eslint"
          - "globals"
      build-tooling:
        patterns:
          - "typescript"
          - "tslib"
          - "esbuild"
          - "ts-node"
          - "jiti"
          - "@types/*"
      e2e-tooling:
        patterns:
          - "@playwright/test"
          - "obsidian-launcher"
          - "commander"
    ignore:
      # typescript-eslint hard-caps its peer dep at "typescript <6.1.0"
      # (typescript-eslint#12518, closed as not-planned) and ts-node needs
      # the Compiler API that TS 7.0 drops until 7.1. See flow-268.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "github_actions"
    commit-message:
      prefix: "deps"
      include: "scope"
