name: OpenSpec

on:
    push:
        branches: ["main"]
        paths:
            - "openspec/**"
            - ".github/workflows/openspec.yml"
    pull_request:
        branches: ["**"]
        paths:
            - "openspec/**"
            - ".github/workflows/openspec.yml"
    workflow_dispatch: {}

env:
    BUN_VERSION: "1.3.12"

permissions: {}

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    validate:
        runs-on: ubuntu-latest
        permissions:
            contents: read

        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
            - name: Setup Environment
              uses: ./.github/actions/setup-env
              with:
                  bun-version: ${{ env.BUN_VERSION }}

            - name: Validate OpenSpec specs and changes
              run: bun exec openspec validate --all
