name: OpenSpec

on:
    push:
        branches: ["main"]
        paths:
            - "openspec/**"
            - ".github/workflows/openspec.yml"
    pull_request:
        branches: ["**"]
        paths:
            - "openspec/**"
            - ".github/workflows/openspec.yml"
    workflow_dispatch: {}

env:
    BUN_VERSION: "1.3.12"

jobs:
    validate:
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
            - name: Setup Environment
              uses: ./.github/actions/setup-env
              with:
                  bun-version: ${{ env.BUN_VERSION }}

            - name: Validate OpenSpec specs and changes
              run: bun x openspec validate --all
