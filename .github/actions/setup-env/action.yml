name: 'Setup Bun and Install'
description: 'Sets up Bun and installs dependencies'
inputs:
  bun-version-file:
    description: 'File to read Bun version from (e.g. package.json or .bun-version)'
    required: false
    default: 'package.json'
runs:
  using: "composite"
  steps:
    - name: Install Bun
      uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      with:
        bun-version-file: ${{ inputs.bun-version-file }}
    - name: Install dependencies
      run: bun install
      shell: bash
